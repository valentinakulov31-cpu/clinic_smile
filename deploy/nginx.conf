server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 201.24.63.92 _;

    root /opt/ulibnis_front/current;
    index index.html;

    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://unix:/run/clinic_smile/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://unix:/run/clinic_smile/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Keep backend assets out of the frontend file-extension location below.
    location ^~ /static/ {
        alias /opt/clinic_smile/app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location ^~ /media/ {
        alias /opt/clinic_smile/shared/media/;
        expires 7d;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
