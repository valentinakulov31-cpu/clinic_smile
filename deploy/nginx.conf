server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ulybnis24.ru www.ulybnis24.ru 201.24.63.92 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://ulybnis24.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ulybnis24.ru;

    ssl_certificate /etc/letsencrypt/live/ulybnis24.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ulybnis24.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:clinic_ssl:10m;
    ssl_session_timeout 1d;

    root /opt/ulibnis_front/current;
    index index.html;

    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://unix:/run/clinic_smile/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://unix:/run/clinic_smile/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Keep backend assets out of the frontend file-extension location below.
    location ^~ /static/ {
        alias /opt/clinic_smile/app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location ^~ /media/ {
        alias /opt/clinic_smile/shared/media/;
        expires 7d;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ulybnis24.ru;

    ssl_certificate /etc/letsencrypt/live/ulybnis24.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ulybnis24.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://ulybnis24.ru$request_uri;
}
