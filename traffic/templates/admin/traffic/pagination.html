{% if page.has_other_pages %}
<nav class="traffic-pagination" aria-label="Страницы журнала">
  {% if page.has_previous %}<a href="?{{ filter_query }}&amp;page={{ page.previous_page_number }}" aria-label="Предыдущая страница">&larr;</a>{% endif %}
  <span>Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{{ filter_query }}&amp;page={{ page.next_page_number }}" aria-label="Следующая страница">&rarr;</a>{% endif %}
</nav>
{% endif %}
